<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PriceWatch</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}" />
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true">
        <!-- NEW LOGO IMAGE -->
        <img src="{{ url_for('static', filename='image_a9cef0.jpg') }}" alt="PriceWatch Logo" style="height: 36px; width: auto; border-radius: 4px;" />
      </span>
      <div>
        <h1>PriceWatch</h1>
      </div>
    </div>
    <a class="sample-link" href="/sample" target="_blank" rel="noopener">
      Open sample store page
      <svg class="icon-sm" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M7 17L17 7M17 7H9M17 7V15" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </a>
  </header>

  <div class="status-strip">
    <div class="status-clock">
      <svg class="mini-ring" viewBox="0 0 100 100" role="img" aria-label="Countdown to next check">
        <circle class="mini-ring-track" cx="50" cy="50" r="42" />
        <circle class="mini-ring-progress" id="dial-progress" cx="50" cy="50" r="42" transform="rotate(-90 50 50)" />
      </svg>
      <span class="status-time" id="dial-time">--:--:--</span>
      <span class="status-caption" id="dial-status">next check</span>
    </div>
    <button id="refresh-btn" class="refresh-link">
      <svg class="icon-sm refresh-icon" id="refresh-icon" viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <path d="M4 4V9H9" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M4.5 15C5.79 18.53 9.13 21 13 21C17.97 21 22 16.97 22 12C22 7.03 17.97 3 13 3C9.6 3 6.63 4.85 5.07 7.6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      Refresh now
    </button>
    <p class="last-result" id="last-result"></p>
    <div class="status-stats">
      <span><strong id="stat-total">$0.00</strong> watched</span>
      <span class="status-dot" aria-hidden="true">&middot;</span>
      <span><strong id="stat-count">0</strong> item(s)</span>
    </div>
  </div>

  <main class="hero">
    <h2 class="hero-heading">What should we watch?</h2>
    <form id="add-form" class="search-pill">
      <svg class="pill-icon" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M10.5 13.5L13.5 10.5M8.5 15.5L6.34 17.66C4.95 19.05 4.95 21.3 6.34 22.69C7.73 24.08 9.98 24.08 11.37 22.69L13.5 20.5M15.5 8.5L17.66 6.34C19.05 4.95 19.05 2.7 17.66 1.31C16.27 -0.08 14.02 -0.08 12.63 1.31L10.5 3.5" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" transform="translate(0 2)"/></svg>
      <label for="input-url" class="sr-only">Product URL</label>
      <input type="url" id="input-url" placeholder="Paste a product link to start watching..." required />
      <button type="submit" class="pill-submit" aria-label="Add to watchlist" title="Add to watchlist">
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M12 5V19M5 12H19" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>
      </button>
    </form>
    <p class="form-error" id="add-error" hidden></p>
  </main>

  <section class="watchlist" id="watchlist" aria-label="Watched products">
    <div class="empty-state" id="empty-state" hidden>
      <svg class="empty-icon" viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <circle cx="12" cy="12" r="8" stroke="currentColor" stroke-width="1.4"/>
        <path d="M12 8.5V12L14.2 13.6" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <p>Nothing on the watchlist yet — add a product above.</p>
    </div>
  </section>

  <script id="initial-state" type="application/json">{{ state | tojson }}</script>
  <script src="{{ url_for('static', filename='dashboard.js') }}"></script>
</body>
</html>
