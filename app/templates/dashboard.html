<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PriceWatch</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}" />
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <circle cx="12" cy="12" r="7.25" stroke="currentColor" stroke-width="1.6"/>
          <path d="M12 8.5V12L14.5 13.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M9.5 2.5H14.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
          <path d="M9.5 21.5H14.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
        </svg>
      </span>
      <div>
        <h1>PriceWatch</h1>
        <p class="tagline">Watching prices, keeping time.</p>
      </div>
    </div>
    <a class="sample-link" href="/sample" target="_blank" rel="noopener">
      Open sample store page
      <svg class="icon-sm" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M7 17L17 7M17 7H9M17 7V15" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </a>
  </header>

  <main>
    <section class="watch-panel" aria-label="Auto-refresh countdown">
      <div class="watch-face-wrap">
        <svg class="watch-face" viewBox="0 0 200 200" role="img" aria-label="Countdown to next check">
          <circle class="dial-outer-ring" cx="100" cy="100" r="94" />
          <circle class="dial-bg" cx="100" cy="100" r="88" />
          <g class="tick-marks" id="tick-marks"></g>
          <circle class="dial-progress-track" cx="100" cy="100" r="82" />
          <circle class="dial-progress" id="dial-progress" cx="100" cy="100" r="82"
                  transform="rotate(-90 100 100)" />
          <text class="dial-time" id="dial-time" x="100" y="96" text-anchor="middle">--:--:--</text>
          <text class="dial-label" id="dial-status" x="100" y="119" text-anchor="middle">next check</text>
        </svg>
      </div>
      <div class="watch-controls">
        <button id="refresh-btn" class="crown-button">
          <svg class="icon-md crown-icon" id="refresh-icon" viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path d="M4 4V9H9" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M4.5 15C5.79 18.53 9.13 21 13 21C17.97 21 22 16.97 22 12C22 7.03 17.97 3 13 3C9.6 3 6.63 4.85 5.07 7.6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
          Refresh now
        </button>
        <p class="last-result" id="last-result"></p>
      </div>
    </section>

    <section class="summary-bar" aria-label="Watchlist summary">
      <div class="stat-tile">
        <span class="stat-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none"><path d="M3 7C3 5.34315 4.34315 4 6 4H18C19.6569 4 21 5.34315 21 7V17C21 18.6569 19.6569 20 18 20H6C4.34315 20 3 18.6569 3 17V7Z" stroke="currentColor" stroke-width="1.6"/><path d="M3 10H21" stroke="currentColor" stroke-width="1.6"/><path d="M7 15H10" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
        </span>
        <span class="stat-value" id="stat-total">$0.00</span>
        <span class="stat-label">Total watched value</span>
      </div>
      <div class="stat-tile">
        <span class="stat-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none"><path d="M4 6H20M4 12H20M4 18H14" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
        </span>
        <span class="stat-value" id="stat-count">0</span>
        <span class="stat-label">Items on watchlist</span>
      </div>
    </section>

    <section class="add-panel">
      <form id="add-form">
        <label for="input-url" class="sr-only">Product URL</label>
        <input type="url" id="input-url" placeholder="https://store.example.com/product/..." required />
        <button type="submit">
          <svg class="icon-sm" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M12 5V19M5 12H19" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>
          Add to watchlist
        </button>
      </form>
      <p class="form-error" id="add-error" hidden></p>
    </section>

    <section class="watchlist" id="watchlist" aria-label="Watched products">
      <div class="empty-state" id="empty-state" hidden>
        <svg class="empty-icon" viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <circle cx="12" cy="12" r="8" stroke="currentColor" stroke-width="1.4"/>
          <path d="M12 8.5V12L14.2 13.6" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <p>Nothing on the watchlist yet — add a product above.</p>
      </div>
    </section>
  </main>

  <script id="initial-state" type="application/json">{{ state | tojson }}</script>
  <script src="{{ url_for('static', filename='dashboard.js') }}"></script>
</body>
</html>
